name: Publish fork release

on:
  push:
    branches:
      - stable
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-fork-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'looplj/axonhub' }}

jobs:
  create-fork-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Resolve next fork release tag
        id: version
        run: |
          set -euo pipefail

          upstream_url="https://github.com/${UPSTREAM_REPOSITORY}.git"
          channel="${GITHUB_REF_NAME:-stable}"
          tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$channel" == "beta" ]]; then
            tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)(\.?[0-9]+)?$'
          elif [[ "$channel" != "stable" ]]; then
            echo "Unsupported fork release branch: ${channel}" >&2
            exit 1
          fi

          upstream_tags=$(git ls-remote --tags --refs "$upstream_url" \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | grep -E "$tag_pattern" || true)

          if [[ -z "$upstream_tags" ]]; then
            echo "No ${channel} upstream version tags found in ${UPSTREAM_REPOSITORY}." >&2
            exit 1
          fi

          upstream_tag=$(printf '%s\n' "$upstream_tags" | sort -V | tail -n 1)
          existing_fork_tags=$(git ls-remote --tags --refs origin "refs/tags/${upstream_tag}-fork.*" \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' || true)

          latest_fork=0
          fork_prefix="${upstream_tag}-fork."
          while IFS= read -r fork_tag; do
            [[ -n "$fork_tag" ]] || continue
            fork_number="${fork_tag#"$fork_prefix"}"
            if [[ "$fork_number" =~ ^[0-9]+$ ]] && (( fork_number > latest_fork )); then
              latest_fork="$fork_number"
            fi
          done <<< "$existing_fork_tags"

          release_name="${upstream_tag}-fork.$((latest_fork + 1))"

          if git ls-remote --exit-code --tags origin "refs/tags/${release_name}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${release_name}" >&2
            exit 1
          fi

          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "Next fork release tag: ${release_name}"

      - name: Push fork release tag
        env:
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_NAME" "$GITHUB_SHA" -m "Release ${RELEASE_NAME}"
          git push origin "refs/tags/${RELEASE_NAME}"

  publish-docker:
    needs: create-fork-tag
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.create-fork-tag.outputs.release_name }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  publish-binaries:
    needs: create-fork-tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.create-fork-tag.outputs.release_name }}
    permissions:
      contents: write
      packages: write
    secrets: inherit

  publish-release:
    needs: [create-fork-tag, publish-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ needs.create-fork-tag.outputs.release_name }}
        run: gh release edit "$RELEASE_NAME" --draft=false

  notify-telegram:
    needs: [create-fork-tag, publish-docker, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send Telegram release notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_NAME: ${{ needs.create-fork-tag.outputs.release_name }}
          DOCKERHUB_IMAGE: ${{ needs.publish-docker.outputs.image }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          html_escape() {
            printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
          }

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_NAME}"
          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          dockerhub_url="https://hub.docker.com/r/${DOCKERHUB_IMAGE}"
          packages_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pkgs/container/axonhub"
          if [[ -z "$DOCKERHUB_IMAGE" ]]; then
            echo "Docker Hub image output is required for the release notification." >&2
            exit 1
          fi
          dockerhub_image="${DOCKERHUB_IMAGE}:${RELEASE_NAME}"
          ghcr_image="${GHCR_IMAGE}:${RELEASE_NAME}"
          tag_hashtag=$(printf '%s' "$RELEASE_NAME" | sed 's/[^[:alnum:]_]/_/g')
          release_name_html=$(html_escape "$RELEASE_NAME")
          branch_html=$(html_escape "$GITHUB_REF_NAME")
          dockerhub_image_html=$(html_escape "$dockerhub_image")
          ghcr_image_html=$(html_escape "$ghcr_image")

          message=$(cat <<EOF
          🚀 <b>AxonHub Fork 新版本发布！</b>

          📦 版本号：<code>${release_name_html}</code>
          🌿 分支：<code>${branch_html}</code>
          🔖 提交：<code>${GITHUB_SHA::7}</code>

          🐳 <b>Docker 部署：</b>
          <pre><code class="language-bash"># GitHub Container Registry
          docker pull ${ghcr_image_html}
          # Docker Hub
          docker pull ${dockerhub_image_html}</code></pre>

          🔗 <b>相关链接：</b>
          • <a href="${release_url}">GitHub Release</a>
          • <a href="${dockerhub_url}">Docker Hub</a>
          • <a href="${packages_url}">GitHub Packages</a>
          • <a href="${workflow_url}">构建记录</a>

          #AxonHub #Release #${tag_hashtag}
          EOF
          )

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true"
