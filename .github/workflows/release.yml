name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # One frontend build for the server archives and every desktop installer.
  # Uploading the artifact is the only step that needs actions: write.
  frontend:
    name: Frontend
    if: ${{ inputs.tag != '' || !contains(github.ref_name, '-fork.') }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: make build-frontend

      - name: Check the frontend build
        run: test -f internal/server/static/dist/index.html

      - name: Upload the frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/server/static/dist/
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    if: ${{ inputs.tag != '' || !contains(github.ref_name, '-fork.') }}
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true

      - name: Verify production dependency graphs
        run: |
          ./scripts/verify-go-sse-dependency-test.sh
          ./scripts/verify-go-sse-dependency.sh

      - name: Update VERSION file
        if: ${{ !contains(inputs.tag || github.ref_name, 'beta') && !contains(inputs.tag || github.ref_name, 'rc') && !contains(inputs.tag || github.ref_name, '-fork.') }}
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "Updating VERSION file to: $VERSION"
          echo "$VERSION" > internal/build/VERSION
          git add internal/build/VERSION

      - name: Commit VERSION file
        if: ${{ !contains(inputs.tag || github.ref_name, 'beta') && !contains(inputs.tag || github.ref_name, 'rc') && !contains(inputs.tag || github.ref_name, '-fork.') }}
        continue-on-error: true
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if VERSION files have changes
          if git diff --cached --quiet VERSION internal/build/VERSION; then
            echo "No changes to VERSION files"
          else
            # Commit VERSION files with [skip ci] to avoid triggering other workflows
            git commit -m "chore: update VERSION to ${{ inputs.tag || github.ref_name }} [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      - name: Download the frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/server/static/dist

      - name: Check the frontend build
        run: test -f internal/server/static/dist/index.html

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=${{ inputs.tag != '' && 'validate,homebrew' || 'validate' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          AXONHUB_RELEASE_REPOSITORY: ${{ github.repository }}
          AXONHUB_UPDATE_REPOSITORY: ${{ vars.UPDATE_REPOSITORY || github.repository }}
          AXONHUB_UPDATE_CHANNEL: ${{ (contains(inputs.tag || github.ref_name, 'beta') || contains(inputs.tag || github.ref_name, 'rc')) && 'beta' || 'stable' }}
          SKIP_FRONTEND_BUILD: "1"

  # Same tag as the server release above. Desktop waits so its installers
  # upload onto the draft GoReleaser opened, at internal/build/VERSION.
  # It reuses the frontend artifact instead of building it again.
  desktop:
    if: ${{ vars.MYGO_UPDATER_PUBLIC_KEY != '' }}
    needs: [frontend, goreleaser]
    uses: ./.github/workflows/desktop-release.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      frontend-artifact: frontend-dist
      write-download-notes: false

  notes:
    name: Download table
    needs: [goreleaser, desktop]
    if: ${{ always() && needs.goreleaser.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-download-notes-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Write the download table
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || vars.DOCKERHUB_NAME || vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_IMAGE || secrets.DOCKERHUB_NAME || secrets.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
        run: python3 scripts/release-download-notes.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
