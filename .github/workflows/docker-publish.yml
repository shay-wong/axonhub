# Publish Docker image
# Copy from new-api 
# https://github.com/QuantumNous/new-api/blob/main/.github/workflows/docker-image-arm64.yml
# The native-architecture build matrix is delegated to the shared reusable
# workflow docker-build.yml (mode: release).

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true
        type: string
      manifest_only:
        description: 'Only create multi-arch manifests from existing arch tags'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0)'
        required: true
        type: string
      manifest_only:
        description: 'Only create multi-arch manifests from existing arch tags'
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: 'Published Docker Hub repository path'
        value: ${{ jobs.create_manifests.outputs.image }}

jobs:
  build_single_arch:
    name: Build & push (release)
    if: ${{ inputs.manifest_only != true }}
    uses: ./.github/workflows/docker-build.yml
    with:
      mode: release
      ref: ${{ inputs.tag || github.ref }}
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
    secrets: inherit

  create_manifests:
    name: Create multi-arch manifests (Docker Hub)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: ${{ always() && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/')) && (inputs.manifest_only == true || needs.build_single_arch.result == 'success') }}
    outputs:
      image: ${{ steps.dockerhub.outputs.image }}
    steps:
      - name: Extract tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_TAG" ]; then
            TAG="${RELEASE_TAG#refs/tags/}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "A tag is required for Docker manifest publishing." >&2
            exit 1
          fi

          CHANNEL="stable"
          if [[ "$TAG" == *beta* || "$TAG" == *rc* ]]; then
            CHANNEL="beta"
          fi
          FLOATING_TAG="latest"
          if [[ "$CHANNEL" == "beta" ]]; then
            FLOATING_TAG="beta"
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "FLOATING_TAG=$FLOATING_TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "floating_tag=$FLOATING_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve Docker Hub image
        id: dockerhub
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || vars.DOCKERHUB_NAME || vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_IMAGE || secrets.DOCKERHUB_NAME || secrets.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEFAULT_DOCKERHUB_NAMESPACE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          image="${DOCKERHUB_IMAGE:-}"
          if [ -z "$image" ]; then
            image="${DOCKERHUB_USERNAME:-$DEFAULT_DOCKERHUB_NAMESPACE}/axonhub"
          fi

          image="${image#docker.io/}"
          image="${image%/}"

          if [ -z "$image" ]; then
            image="${DEFAULT_DOCKERHUB_NAMESPACE}/axonhub"
          fi

          if [[ "$image" == *:* ]] || [[ "$image" =~ [[:space:]] ]]; then
            echo "DOCKERHUB_IMAGE/DOCKERHUB_NAME must be a Docker Hub namespace or repository path without tag." >&2
            exit 1
          fi

          if [[ "$image" != */* ]]; then
            image="${image}/axonhub"
          fi

          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required for Docker Hub publishing." >&2
            exit 1
          fi

          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Docker Hub image: $image"

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Inspect manifest targets
        id: manifest
        env:
          IMAGE: ${{ steps.dockerhub.outputs.image }}
          TAG: ${{ steps.version.outputs.tag }}
          FLOATING_TAG: ${{ steps.version.outputs.floating_tag }}
        run: |
          set -euo pipefail

          require_source_tag() {
            local source="$1"
            if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
              echo "Required source image is missing: $source" >&2
              exit 1
            fi
          }

          tag_exists() {
            local target="$1"
            docker buildx imagetools inspect "$target" >/dev/null 2>&1
          }

          tag_digest() {
            local target="$1"
            docker buildx imagetools inspect "$target" | awk '/^Digest:/ {print $2; exit}'
          }

          manifest_arch_digest() {
            local target="$1"
            local arch="$2"
            docker buildx imagetools inspect --raw "$target" \
              | jq -r --arg arch "$arch" '
                (.manifests // [])
                | map(select(.platform.os == "linux" and .platform.architecture == $arch))
                | first
                | .digest // empty
              '
          }

          require_source_tag "${IMAGE}:${TAG}-amd64"
          require_source_tag "${IMAGE}:${TAG}-arm64"
          require_source_tag "${IMAGE}:${FLOATING_TAG}-amd64"
          require_source_tag "${IMAGE}:${FLOATING_TAG}-arm64"

          if tag_exists "${IMAGE}:${TAG}"; then
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
            echo "Version manifest already exists: ${IMAGE}:${TAG}"
          else
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
          fi

          floating_amd64_digest="$(tag_digest "${IMAGE}:${FLOATING_TAG}-amd64")"
          floating_arm64_digest="$(tag_digest "${IMAGE}:${FLOATING_TAG}-arm64")"

          if tag_exists "${IMAGE}:${FLOATING_TAG}"; then
            current_amd64_digest="$(manifest_arch_digest "${IMAGE}:${FLOATING_TAG}" amd64)"
            current_arm64_digest="$(manifest_arch_digest "${IMAGE}:${FLOATING_TAG}" arm64)"

            if [[ "$current_amd64_digest" == "$floating_amd64_digest" && "$current_arm64_digest" == "$floating_arm64_digest" ]]; then
              echo "floating_current=true" >> "$GITHUB_OUTPUT"
              echo "Floating manifest already points to current arch tags: ${IMAGE}:${FLOATING_TAG}"
            else
              echo "floating_current=false" >> "$GITHUB_OUTPUT"
              echo "Floating manifest exists but points to old arch digests; it will be updated."
              echo "current amd64: ${current_amd64_digest:-missing}"
              echo "source  amd64: ${floating_amd64_digest}"
              echo "current arm64: ${current_arm64_digest:-missing}"
              echo "source  arm64: ${floating_arm64_digest}"
            fi
          else
            echo "floating_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create & push manifest (Docker Hub - version)
        if: ${{ steps.manifest.outputs.version_exists != 'true' }}
        run: |
          docker buildx imagetools create \
            -t ${{ steps.dockerhub.outputs.image }}:${{ steps.version.outputs.tag }} \
            ${{ steps.dockerhub.outputs.image }}:${{ steps.version.outputs.tag }}-amd64 \
            ${{ steps.dockerhub.outputs.image }}:${{ steps.version.outputs.tag }}-arm64

      - name: Create & push manifest (Docker Hub - floating)
        if: ${{ steps.manifest.outputs.floating_current != 'true' }}
        run: |
          docker buildx imagetools create \
            -t ${{ steps.dockerhub.outputs.image }}:${{ steps.version.outputs.floating_tag }} \
            ${{ steps.dockerhub.outputs.image }}:${{ steps.version.outputs.floating_tag }}-amd64 \
            ${{ steps.dockerhub.outputs.image }}:${{ steps.version.outputs.floating_tag }}-arm64
