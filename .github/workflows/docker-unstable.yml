name: Publish Docker image (unstable)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  prepare:
    name: Pin commit & date
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.pin.outputs.commit_sha }}
      build_date: ${{ steps.pin.outputs.build_date }}
      base_version: ${{ steps.pin.outputs.base_version }}
      dockerhub_image: ${{ steps.pin.outputs.dockerhub_image }}
    steps:
      - name: Check out beta
        uses: actions/checkout@v7
        with:
          ref: beta
          fetch-depth: 1
          persist-credentials: false

      - name: Pin commit SHA & date
        id: pin
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || vars.DOCKERHUB_NAME || vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DEFAULT_DOCKERHUB_NAMESPACE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git fetch --tags --force --depth=1
          BASE_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(cat internal/build/VERSION 2>/dev/null || true)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=v0.0.0
          fi
          if ! printf '%s\n' "$BASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid base version: $BASE_VERSION" >&2
            exit 1
          fi
          image="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME:-$DEFAULT_DOCKERHUB_NAMESPACE}/axonhub}"
          image="${image#docker.io/}"
          image="${image%/}"
          if [[ "$image" != */* ]]; then
            image="${image}/axonhub"
          fi
          if [[ "$image" == *:* ]] || [[ "$image" =~ [[:space:]] ]]; then
            echo "DOCKERHUB_IMAGE/DOCKERHUB_NAME must be a Docker Hub namespace or repository path without tag." >&2
            exit 1
          fi
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          printf 'base_version=%s\n' "$BASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'dockerhub_image=%s\n' "$image" >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out pinned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Write VERSION
        env:
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: printf '%s\n' "${BASE_VERSION}-unstable.${BUILD_DATE}" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ needs.prepare.outputs.dockerhub_image }}

      - name: Build & push single-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            AXONHUB_UPDATE_REPOSITORY=${{ vars.UPDATE_REPOSITORY || github.repository }}
            AXONHUB_UPDATE_CHANNEL=beta
            VITE_GITHUB_REPOSITORY=${{ github.repository }}
          tags: |
            ${{ needs.prepare.outputs.dockerhub_image }}:unstable-${{ matrix.arch }}
            ${{ needs.prepare.outputs.dockerhub_image }}:unstable-${{ needs.prepare.outputs.build_date }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifest (Docker Hub)
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - unstable)
        env:
          IMAGE: ${{ needs.prepare.outputs.dockerhub_image }}
        run: |
          DATE=${{ needs.prepare.outputs.build_date }}
          docker buildx imagetools create \
            -t "${IMAGE}:unstable" \
            "${IMAGE}:unstable-amd64" \
            "${IMAGE}:unstable-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:unstable-${DATE}" \
            "${IMAGE}:unstable-${DATE}-amd64" \
            "${IMAGE}:unstable-${DATE}-arm64"
