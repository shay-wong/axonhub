name: Publish Docker image (unstable)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  prepare:
    name: Pin commit & date
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.pin.outputs.commit_sha }}
      build_date: ${{ steps.pin.outputs.build_date }}
      base_version: ${{ steps.pin.outputs.base_version }}
      dockerhub_image: ${{ steps.pin.outputs.dockerhub_image }}
    steps:
      - name: Check out beta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: beta
          fetch-depth: 1
          persist-credentials: false

      - name: Pin commit SHA & date
        id: pin
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || vars.DOCKERHUB_NAME || vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DEFAULT_DOCKERHUB_NAMESPACE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git fetch --tags --force --depth=1
          BASE_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(cat internal/build/VERSION 2>/dev/null || true)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=v0.0.0
          fi
          if ! printf '%s\n' "$BASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid base version: $BASE_VERSION" >&2
            exit 1
          fi
          image="${DOCKERHUB_IMAGE:-${DOCKERHUB_USERNAME:-$DEFAULT_DOCKERHUB_NAMESPACE}/axonhub}"
          image="${image#docker.io/}"
          image="${image%/}"
          if [[ "$image" != */* ]]; then
            image="${image}/axonhub"
          fi
          if [[ "$image" == *:* ]] || [[ "$image" =~ [[:space:]] ]]; then
            echo "DOCKERHUB_IMAGE/DOCKERHUB_NAME must be a Docker Hub namespace or repository path without tag." >&2
            exit 1
          fi
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          printf 'base_version=%s\n' "$BASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'dockerhub_image=%s\n' "$image" >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build & push (unstable)
    needs: [prepare]
    uses: ./.github/workflows/docker-build.yml
    with:
      mode: unstable
      dockerhub_image: ${{ needs.prepare.outputs.dockerhub_image }}
      ref: ${{ needs.prepare.outputs.commit_sha }}
      base_version: ${{ needs.prepare.outputs.base_version }}
      build_date: ${{ needs.prepare.outputs.build_date }}
    permissions:
      contents: read
    secrets: inherit

  create_manifests:
    name: Create multi-arch manifest (Docker Hub)
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - unstable)
        env:
          IMAGE: ${{ needs.prepare.outputs.dockerhub_image }}
        run: |
          DATE=${{ needs.prepare.outputs.build_date }}
          docker buildx imagetools create \
            -t "${IMAGE}:unstable" \
            "${IMAGE}:unstable-amd64" \
            "${IMAGE}:unstable-arm64"
          docker buildx imagetools create \
            -t "${IMAGE}:unstable-${DATE}" \
            "${IMAGE}:unstable-${DATE}-amd64" \
            "${IMAGE}:unstable-${DATE}-arm64"
